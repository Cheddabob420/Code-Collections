set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

Deep_Black="#0a0c10"
Teal="#00c7d4"
Orange="#ff9e64"
Muted="#2a2e37"
Yellow="#ffc777"
Green="#c3e88d"
Red="#ff757f"
Magenta="#c099ff"
Cyan="#86e1fc"

set -g status "on"
set -g status-bg "${Teal}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

set -g pane-border-style "fg=${Teal}"
set -g pane-active-border-style "fg=${Teal}"

set -g window-status-activity-style "fg=${Teal},bg=${Deep_Black},none"
set -g window-status-separator ""
set -g window-status-style "fg=${Teal},bg=${Deep_Black},none"

set -g message-style "fg=${Teal},bg=${Deep_Black},align=centre"
set -g message-command-style "fg=${Teal},bg=${Deep_Black},align=centre"

set -g window-status-current-format "#[fg=${Teal},bg=${Deep_Black}] #I: #[fg=${Teal},bg=${Deep_Black}](✔️) #[fg=${Teal},bg=${Deep_Black}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${Teal},bg=${Deep_Black}]"

set -g window-status-format "#[fg=${Teal},bg=${Deep_Black}] #I: #[fg=${Teal},bg=${Deep_Black}]#W"
